name: Windows portable build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements_build.txt
      - run: |
          if (Test-Path update_public_key.bin) { python build_windows.py --public-key update_public_key.bin }
          else { python build_windows.py }
      - uses: actions/upload-artifact@v4
        with:
          name: MHF-Windows-x64-no-DB
          path: release/*
          if-no-files-found: error
